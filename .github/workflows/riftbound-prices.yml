# Daily refresh of public/riftbound-prices.json from tcgcsv's TCGplayer dump.
# tcgcsv updates once a day around 20:00 UTC; we pull an hour after. The
# commit lands on main, which triggers the normal Vercel static deploy —
# the app itself stays local-only and just fetches this file as an asset.

name: Refresh Riftbound prices

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build price file
        run: python3 scripts/build_riftbound_prices.py

      - name: Commit if changed
        run: |
          if git diff --quiet public/riftbound-prices.json; then
            echo "no price changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/riftbound-prices.json
          git commit -m "chore: refresh Riftbound TCGplayer prices"
          git push
