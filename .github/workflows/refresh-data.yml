# Daily refresh of the static data assets the local-only app ships with:
#   public/riftbound-prices.json — Riftbound TCGplayer prices (tcgcsv)
#   public/jp-prices.json        — Japanese Pokémon TCGplayer prices (tcgcsv)
#   public/en-prices.json        — English Pokémon TCGplayer fallback (tcgcsv)
#   public/sealed-index/*.json   — sealed products per game w/ UPC + price (tcgcsv)
#   public/meta-decks/*.json     — scraped meta decks per game
# tcgcsv updates once a day around 20:00 UTC; we pull an hour after, with a
# 23:00 retry in case tcgcsv ran late (the scripts' last-updated stamp check
# makes the retry a no-op when the first run already synced). Commits land on
# main, which triggers the normal Vercel static deploy — the app itself stays
# local-only and just fetches these files as assets.

name: Refresh data assets

on:
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data

jobs:
  refresh:
    # Forks inherit this file — don't run their copies against tcgcsv and the
    # deck sites (the scripts identify themselves as Rarebox). To self-refresh
    # a fork, change this guard AND the User-Agent in scripts/build_*_prices.py.
    if: github.repository == 'novaoc/rarebox'
    runs-on: ubuntu-latest
    # The sealed index walks every group of every category (~1900 groups,
    # rate-limited to tcgcsv's 10 req/s) — most of the budget is that walk.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Install scraper deps
        run: |
          pip install httpx beautifulsoup4
          sudo apt-get update -q && (sudo apt-get install -y 7zip || sudo apt-get install -y p7zip-full)

      - name: Riftbound prices
        run: python3 scripts/build_riftbound_prices.py

      - name: Japanese Pokémon prices
        run: python3 scripts/build_jp_prices.py

      - name: English Pokémon prices (fallback for sets pokemontcg.io leaves priceless)
        run: python3 scripts/build_en_prices.py

      - name: English Pokémon extras (cards pokemontcg.io lacks entirely — ME promos etc.)
        run: python3 scripts/build_en_extras.py
        continue-on-error: true # supplement going stale beats blocking prices

      - name: Japanese Pokémon search index
        run: python3 scripts/build_jp_index.py

      - name: One Piece TCGplayer prices
        run: python3 scripts/build_op_prices.py

      - name: One Piece Japanese prices (PriceCharting, rotating shard)
        run: python3 scripts/build_op_jp_prices.py
        continue-on-error: true # a PC hiccup shouldn't block the other feeds

      - name: Yu-Gi-Oh! TCGplayer prices
        run: python3 scripts/build_ygo_prices.py

      - name: Typo-rescue name index
        run: python3 scripts/build_name_index.py
        continue-on-error: true # rescue index going stale beats blocking prices

      - name: Sealed product index
        run: python3 scripts/build_sealed_index.py

      - name: Meta decks
        run: python3 scripts/build_meta_decks.py
        continue-on-error: true # scrapers depend on third-party HTML; stale decks beat no deploy

      - name: Commit if changed
        run: |
          git add public/riftbound-prices.json public/jp-prices.json public/en-prices.json public/jp-index.json public/op-prices.json public/ygo-prices.json public/name-index.json scripts/data/ygo_products.json public/sealed-index public/meta-decks
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh price & meta-deck data assets"
          git pull --rebase origin main
          git push
